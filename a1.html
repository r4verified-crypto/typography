<html>
  <head>
    <title>MY food Menu</title>
    <style>
      body{
        font-family:arial;
        background:#fff8f0;
        padding:30px;
        text-align:center;
      }
      h1{color:#e65c00;}
      h1+p {
        background: #ffe0b2;
        padding:10px 20px;
        border-radius:8px;
        color:#bf360c;
        display:inline-block;
      }
      ul{padding:0;margin-top:20px;}
      ul>li {
        list-style:none;
        font-size:18px;
        font-weight:bold;
        color:#5d4037;
        padding:10px 20px;
        width:260px;
        background:#fff3e0;
        border-radius:8px;
      }
      ul li:nth-child(3) {
        background:#ffe082;
        color:#e65c00;
      }
      .desc {
         color:#555;
         margin-top:20px;
         font-weight:bold;
      }
      .links{margin-top:25px;}
      a{
        color:#e65c00;
        text-decoration:none;
        font-size:15px;
        margin:0 12px;
        border:2px sold #e65c00;
        border-radius:8px;
      }
      a:hover{
        background:#e65c00;
        color:white
      }
    </style>
  </head>
  <body>
    <h1>My Food Menu</h1>
    <p>Pick your favourite things and dig in!</p>
    <ul>
      <li>Pizza</li>
      <li>Burger</li>
      <li>Tacos-Chef's special</li>
      <li>Noodles</li>
      <li>Ice Cream</li>
    </ul>
    <p class="desc">Every dish on this menu</p>
  </body>
</html>
